<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Analyseur de dossier - Electron</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #45a049; }

        .progress-container {
            background-color: #f0f0f0;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 30px;
            background-color: #4CAF50;
            border-radius: 10px;
            text-align: center;
            line-height: 30px;
            color: white;
            transition: width 0.3s;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .recent-folder {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: #f9f9f9;
            border-radius: 5px;
            cursor: pointer;
        }
        .recent-folder:hover { background: #e0e0e0; }
        .delete-btn {
            background: #ff4444;
            padding: 5px 10px;
            font-size: 12px;
        }
        .delete-btn:hover { background: #cc0000; }

        .file-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .file-item {
            padding: 8px;
            margin: 5px 0;
            background: #f9f9f9;
            border-radius: 5px;
            font-size: 14px;
        }
        .file-name { font-weight: bold; }
        .file-size { color: #666; font-size: 12px; }

        canvas { max-width: 100%; }

        h3 { margin-top: 0; color: #333; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>📁 Analyseur de dossier professionnel</h1>

    <button id="selectBtn">📂 Choisir un dossier</button>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar">0%</div>
    </div>

    <div class="grid">
        <!-- Colonne gauche : Résultats -->
        <div class="card">
            <h3>📊 Résultats de l'analyse</h3>
            <div id="results"></div>
            <canvas id="myChart" width="400" height="400"></canvas>
        </div>

        <!-- Colonne droite : Dossiers récents + Fichiers lourds -->
        <div class="card">
            <h3>🕒 Dossiers récents</h3>
            <div id="recentFolders"></div>

            <hr>

            <h3>🏆 Top 10 des fichiers les plus lourds</h3>
            <div id="largestFiles" class="file-list"></div>
        </div>
    </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
